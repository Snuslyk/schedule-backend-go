basePath: /
definitions:
  domain.AuthResponse:
    properties:
      accessToken:
        example: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9...
        type: string
    type: object
  domain.CreateGroupDTO:
    properties:
      name:
        example: ИС-21
        type: string
    type: object
  domain.CreateSubjectDTO:
    properties:
      name:
        example: Математика
        type: string
    type: object
  domain.CreateTeacherDTO:
    properties:
      name:
        example: Иванов Иван Иванович
        type: string
    type: object
  domain.ErrorResponse:
    properties:
      error:
        example: Bad Request
        type: string
      message:
        example: Bad request message
        type: string
      statusCode:
        example: 400
        type: integer
    type: object
  domain.Group:
    properties:
      id:
        example: 1
        type: integer
      name:
        example: ИС-21
        type: string
    type: object
  domain.LoginDTO:
    properties:
      email:
        example: ivan@example.com
        type: string
      password:
        example: secret123
        type: string
    type: object
  domain.MessageResponse:
    properties:
      message:
        example: Operation successful
        type: string
    type: object
  domain.RegisterDTO:
    properties:
      email:
        example: ivan@example.com
        type: string
      name:
        example: Иван Иванов
        type: string
      password:
        example: secret123
        type: string
      roles:
        items:
          type: string
        type: array
    type: object
  domain.Subject:
    properties:
      id:
        example: 1
        type: integer
      name:
        example: Математика
        type: string
    type: object
  domain.Teacher:
    properties:
      id:
        example: 1
        type: integer
      name:
        example: Иванов Иван Иванович
        type: string
    type: object
  domain.UserProfile:
    properties:
      avatar:
        example: https://storage.yandexcloud.net/bucket/avatars/user.webp
        type: string
      email:
        example: ivan@example.com
        type: string
      name:
        example: Иван Иванов
        type: string
      roles:
        example:
        - STUDENT
        items:
          type: string
        type: array
    type: object
host: localhost:4242
info:
  contact: {}
  description: Educational timetable and schedule API with flat lessons, Redis caching,
    and S3 storage.
  title: Schedule API
  version: "1.0"
paths:
  /api/auth/avatar:
    post:
      consumes:
      - multipart/form-data
      description: Upload avatar image with optional cropData to S3
      parameters:
      - description: Avatar image file
        in: formData
        name: avatar
        required: true
        type: file
      - description: JSON cropData {x, y, width, height}
        in: formData
        name: cropData
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/domain.MessageResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/domain.ErrorResponse'
      security:
      - BearerAuth: []
      summary: Upload user avatar
      tags:
      - user
  /api/auth/login:
    post:
      consumes:
      - application/json
      description: Authenticate user and return JWT access token
      parameters:
      - description: Login payload
        in: body
        name: input
        required: true
        schema:
          $ref: '#/definitions/domain.LoginDTO'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/domain.AuthResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/domain.ErrorResponse'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/domain.ErrorResponse'
      summary: User login
      tags:
      - auth
  /api/auth/logout:
    post:
      description: Clear refresh token cookie
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/domain.MessageResponse'
      summary: User logout
      tags:
      - auth
  /api/auth/profile:
    get:
      description: Return profile of the authenticated user
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/domain.UserProfile'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/domain.ErrorResponse'
      security:
      - BearerAuth: []
      summary: Get user profile
      tags:
      - user
  /api/auth/refresh:
    post:
      description: Refresh JWT access token using cookie
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/domain.AuthResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/domain.ErrorResponse'
      summary: Refresh token
      tags:
      - auth
  /api/auth/register:
    post:
      consumes:
      - application/json
      description: Register user and return JWT access token
      parameters:
      - description: Registration payload
        in: body
        name: input
        required: true
        schema:
          $ref: '#/definitions/domain.RegisterDTO'
      produces:
      - application/json
      responses:
        "201":
          description: Created
          schema:
            $ref: '#/definitions/domain.AuthResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/domain.ErrorResponse'
        "409":
          description: Conflict
          schema:
            $ref: '#/definitions/domain.ErrorResponse'
      summary: Register a new user
      tags:
      - auth
  /api/auth/role:
    post:
      description: Add or update role for specified user ID
      parameters:
      - description: User UUID
        in: query
        name: id
        required: true
        type: string
      - description: Role name
        in: query
        name: role
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/domain.MessageResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/domain.ErrorResponse'
      security:
      - BearerAuth: []
      summary: Update user role (Admin only)
      tags:
      - user
  /api/group:
    post:
      consumes:
      - application/json
      parameters:
      - description: Group payload
        in: body
        name: input
        required: true
        schema:
          $ref: '#/definitions/domain.CreateGroupDTO'
      produces:
      - application/json
      responses:
        "201":
          description: Created
          schema:
            $ref: '#/definitions/domain.Group'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/domain.ErrorResponse'
        "409":
          description: Conflict
          schema:
            $ref: '#/definitions/domain.ErrorResponse'
      summary: Create group
      tags:
      - group
  /api/group/bulk:
    post:
      consumes:
      - application/json
      parameters:
      - description: List of groups
        in: body
        name: input
        required: true
        schema:
          items:
            $ref: '#/definitions/domain.CreateGroupDTO'
          type: array
      produces:
      - application/json
      responses:
        "201":
          description: Created
          schema:
            additionalProperties:
              type: integer
            type: object
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/domain.ErrorResponse'
        "409":
          description: Conflict
          schema:
            $ref: '#/definitions/domain.ErrorResponse'
      summary: Bulk create groups
      tags:
      - group
  /api/group/id/{id}:
    delete:
      parameters:
      - description: Group ID
        in: path
        name: id
        required: true
        type: integer
      responses:
        "204":
          description: No Content
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/domain.ErrorResponse'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/domain.ErrorResponse'
      summary: Delete group by ID
      tags:
      - group
    get:
      parameters:
      - description: Group ID
        in: path
        name: id
        required: true
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/domain.Group'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/domain.ErrorResponse'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/domain.ErrorResponse'
      summary: Get group by ID
      tags:
      - group
  /api/group/name/{name}:
    delete:
      parameters:
      - description: Group Name
        in: path
        name: name
        required: true
        type: string
      responses:
        "204":
          description: No Content
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/domain.ErrorResponse'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/domain.ErrorResponse'
      summary: Delete group by name
      tags:
      - group
    get:
      parameters:
      - description: Group Name
        in: path
        name: name
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/domain.Group'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/domain.ErrorResponse'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/domain.ErrorResponse'
      summary: Get group by name
      tags:
      - group
  /api/subject:
    get:
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            items:
              $ref: '#/definitions/domain.Subject'
            type: array
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/domain.ErrorResponse'
      summary: List all subjects
      tags:
      - subject
    post:
      consumes:
      - application/json
      parameters:
      - description: Subject payload
        in: body
        name: input
        required: true
        schema:
          $ref: '#/definitions/domain.CreateSubjectDTO'
      produces:
      - application/json
      responses:
        "201":
          description: Created
          schema:
            $ref: '#/definitions/domain.Subject'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/domain.ErrorResponse'
        "409":
          description: Conflict
          schema:
            $ref: '#/definitions/domain.ErrorResponse'
      summary: Create subject
      tags:
      - subject
  /api/subject/bulk:
    post:
      consumes:
      - application/json
      parameters:
      - description: List of subjects
        in: body
        name: input
        required: true
        schema:
          items:
            $ref: '#/definitions/domain.CreateSubjectDTO'
          type: array
      produces:
      - application/json
      responses:
        "201":
          description: Created
          schema:
            additionalProperties:
              type: integer
            type: object
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/domain.ErrorResponse'
        "409":
          description: Conflict
          schema:
            $ref: '#/definitions/domain.ErrorResponse'
      summary: Bulk create subjects
      tags:
      - subject
  /api/teacher:
    get:
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            items:
              $ref: '#/definitions/domain.Teacher'
            type: array
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/domain.ErrorResponse'
      summary: List all teachers
      tags:
      - teacher
    post:
      consumes:
      - application/json
      parameters:
      - description: Teacher payload
        in: body
        name: input
        required: true
        schema:
          $ref: '#/definitions/domain.CreateTeacherDTO'
      produces:
      - application/json
      responses:
        "201":
          description: Created
          schema:
            $ref: '#/definitions/domain.Teacher'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/domain.ErrorResponse'
      summary: Create teacher
      tags:
      - teacher
  /api/teacher/{id}:
    delete:
      parameters:
      - description: Teacher ID
        in: path
        name: id
        required: true
        type: integer
      responses:
        "204":
          description: No Content
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/domain.ErrorResponse'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/domain.ErrorResponse'
      summary: Delete teacher by ID
      tags:
      - teacher
    get:
      parameters:
      - description: Teacher ID
        in: path
        name: id
        required: true
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/domain.Teacher'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/domain.ErrorResponse'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/domain.ErrorResponse'
      summary: Get teacher by ID
      tags:
      - teacher
  /api/teacher/bulk:
    post:
      consumes:
      - application/json
      parameters:
      - description: List of teachers
        in: body
        name: input
        required: true
        schema:
          items:
            $ref: '#/definitions/domain.CreateTeacherDTO'
          type: array
      produces:
      - application/json
      responses:
        "201":
          description: Created
          schema:
            additionalProperties:
              type: integer
            type: object
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/domain.ErrorResponse'
      summary: Bulk create teachers
      tags:
      - teacher
  /api/user/avatar:
    post:
      consumes:
      - multipart/form-data
      description: Upload avatar image with optional cropData to S3
      parameters:
      - description: Avatar image file
        in: formData
        name: avatar
        required: true
        type: file
      - description: JSON cropData {x, y, width, height}
        in: formData
        name: cropData
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/domain.MessageResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/domain.ErrorResponse'
      security:
      - BearerAuth: []
      summary: Upload user avatar
      tags:
      - user
  /api/user/profile:
    get:
      description: Return profile of the authenticated user
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/domain.UserProfile'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/domain.ErrorResponse'
      security:
      - BearerAuth: []
      summary: Get user profile
      tags:
      - user
  /api/user/role:
    post:
      description: Add or update role for specified user ID
      parameters:
      - description: User UUID
        in: query
        name: id
        required: true
        type: string
      - description: Role name
        in: query
        name: role
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/domain.MessageResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/domain.ErrorResponse'
      security:
      - BearerAuth: []
      summary: Update user role (Admin only)
      tags:
      - user
securityDefinitions:
  BearerAuth:
    description: Type "Bearer" followed by a space and the JWT token.
    in: header
    name: Authorization
    type: apiKey
swagger: "2.0"
