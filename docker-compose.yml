services:
  app:
    build: .
    ports:
      - "4242:4242"
    environment:
      - PORT=4242
      - ENV=development
      - COOKIE_DOMAIN=localhost
      - DATABASE_URL=postgresql://postgres:password@postgres:5432/schedule?sslmode=disable
      - REDIS_URL=redis:6379
      - JWT_SECRET=super-secret-schedule-jwt-key
      - CORS_ORIGIN=http://localhost:3000
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  postgres:
    image: postgres:16-alpine
    restart: always
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: password
      POSTGRES_DB: schedule
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./migrations/000001_init.up.sql:/docker-entrypoint-initdb.d/01_init.sql:ro
      - ./migrations/000002_slots_and_flat_lessons.up.sql:/docker-entrypoint-initdb.d/02_flat.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d schedule"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    restart: always
    ports:
      - "6379:6379"
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  pgdata:
  redisdata:
